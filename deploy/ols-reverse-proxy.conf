# ─────────────────────────────────────────────────────────────────────
# OpenLiteSpeed reverse-proxy config for dev.learntharifith.com
#
# Adds a Next.js backend + proxies all traffic to it, while keeping
# the existing .well-known/acme-challenge context for SSL renewals.
#
# Install:
#   1. Append the two blocks below to:
#        /usr/local/lsws/conf/vhosts/dev.learntharifith.com/vhost.conf
#      (place them BEFORE the existing context /.well-known/acme-challenge block)
#   2. Graceful restart OpenLiteSpeed:
#        systemctl restart lshttpd
#
# This file is REFERENCE ONLY — do not copy it wholesale into vhost.conf.
# Copy just the two blocks (extprocessor + context) shown below.
# ─────────────────────────────────────────────────────────────────────


# ── Block 1: define the Next.js backend ──────────────────────────────
extprocessor learntharifithdev {
  type                    proxy
  address                 127.0.0.1:3001
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

# ── Block 2: proxy all traffic to the Next.js backend ────────────────
# Place this BEFORE the /.well-known/acme-challenge context so that
# ACME renewals still hit the filesystem, not the proxy.
context / {
  type                    proxy
  handler                 learntharifithdev
  addDefaultCharset       off
}
